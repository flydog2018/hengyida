server {
    listen 80;
    server_name _;

    # 统一 JSON 访问日志（输出到 stdout，便于 docker logs / ELK 采集）
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    client_max_body_size 8m;

    # 后端 API：保留 /api 前缀原样转发（server 全局前缀为 api）
    location /api/ {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 健康检查：反代 server 的 /healthz（不受 /api 前缀影响）
    location = /healthz {
        proxy_pass http://server:3000/healthz;
        proxy_set_header Host $host;
    }

    # 设计器：Vite base=/designer/，静态资源与 index.html 均在该目录
    location /designer/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /designer/index.html;
    }

    # 运行端：Vite base=/，部署在根路径
    location / {
        root /usr/share/nginx/html/runtime;
        try_files $uri $uri/ /index.html;
    }
}
