# 恒易搭 · 私有化基础编排（一期 / Phase 1）
#
# 安全约定：
#   - 所有数据库凭据从本目录 .env 插值，.env 已被 .gitignore 忽略，禁止提交；
#   - 本文件中只出现变量名，不出现任何真实密码；
#   - 容器内 mysql 用 MYSQL_ROOT_PASSWORD（由 .env 注入），healthcheck 在容器内展开该变量。
#
# 用法（在本目录或仓库根目录均可）：
#   docker compose -f deployments/private/docker-compose.yml --env-file deployments/private/.env up -d

name: hengyida-private

services:
  mysql:
    image: mysql:8.0
    container_name: hengyida-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?required in deployments/private/.env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hengyida}
      MYSQL_USER: ${MYSQL_USER:-hengyida}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?required in deployments/private/.env}
      TZ: Asia/Shanghai
    ports:
      # 仅绑定回环地址；宿主端口默认 3306，冲突时在 .env 设 MYSQL_HOST_PORT=3307
      - '127.0.0.1:${MYSQL_HOST_PORT:-3306}:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - 'mysqladmin ping -h 127.0.0.1 -u root --password="$$MYSQL_ROOT_PASSWORD" --silent'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  server:
    build:
      context: ../..
      dockerfile: deployments/saas/Dockerfile
    container_name: hengyida-server
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DEPLOY_MODE: private
      PORT: 3000
      API_PREFIX: api
      # 容器内通过 compose 网络服务名访问 MySQL；宿主机调试用 127.0.0.1
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER:-hengyida}
      DB_PASSWORD: ${MYSQL_PASSWORD:?required in deployments/private/.env}
      DB_NAME: ${MYSQL_DATABASE:-hengyida}
      JWT_SECRET: ${JWT_SECRET:?required in deployments/private/.env}
    ports:
      - '127.0.0.1:${SERVER_HOST_PORT:-3000}:3000'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/healthz']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # 每日逻辑备份：mysqldump -> gzip -> backups/，保留 7 天。
  # 手动跑一次：docker compose run --rm -e ONCE=1 mysql-backup
  mysql-backup:
    image: mysql:8.0
    container_name: hengyida-mysql-backup
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?required in deployments/private/.env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hengyida}
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      TZ: Asia/Shanghai
    volumes:
      - ../../backups:/backups
      - ../../scripts/mysql-backup.sh:/usr/local/bin/mysql-backup.sh:ro
    entrypoint: ['/bin/sh', '/usr/local/bin/mysql-backup.sh']

volumes:
  mysql-data:
